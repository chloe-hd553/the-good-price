<!--
  ════════════════════════════════════════════════════════════
  PAIEMENT INTÉGRÉ TPG — À coller dans systeme.io
  ════════════════════════════════════════════════════════════

  PARTIE 1 : un bloc "HTML / Code personnalisé" placé dans la page
             à l'endroit où tu veux que le formulaire de carte apparaisse :

      <div id="tgp-checkout" style="max-width:520px;margin:0 auto;"></div>

  PARTIE 2 : tes boutons systeme.io (les vrais boutons de ta page).
             Change juste leur lien :
               - bouton 97€     → lien :  #tgp-oneshot
               - bouton 9,99€   → lien :  #tgp-monthly

  PARTIE 3 : le script ci-dessous, à coller dans le
             "Code personnalisé" de la page (fin de <body>).
             Tu peux le mettre sur toutes tes pages dupliquées.
-->
<script>
(function () {
  var API_BASE = 'https://the-good-price.vercel.app';
  var checkoutInstance = null;
  var stripeJsPromise = null;

  // ── UTM (même logique que le tracking) ────────────────────────────
  function getUTM() {
    try {
      var p = new URLSearchParams(window.location.search);
      return {
        source:   p.get('utm_source')   || 'systemeio',
        medium:   p.get('utm_medium')   || null,
        campaign: p.get('utm_campaign') || null,
        referrer: document.referrer     || null
      };
    } catch (e) {
      return { source: 'systemeio', medium: null, campaign: null, referrer: null };
    }
  }

  // ── Tracking du clic (garde le funnel cohérent) ───────────────────
  function trackClick(label, destination) {
    try {
      var utm = getUTM();
      fetch(API_BASE + '/api/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event: 'cta_click',
          session_id: window.__tgpSid || null,
          label: label,
          destination: destination,
          source: utm.source,
          medium: utm.medium,
          campaign: utm.campaign,
          referrer: utm.referrer
        }),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  // ── Chargement de Stripe.js (une seule fois) ──────────────────────
  function loadStripeJs() {
    if (window.Stripe) return Promise.resolve();
    if (stripeJsPromise) return stripeJsPromise;
    stripeJsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://js.stripe.com/v3/';
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Stripe.js')); };
      document.head.appendChild(s);
    });
    return stripeJsPromise;
  }

  function createSession(plan, embedded) {
    return fetch(API_BASE + '/api/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        plan: plan,
        demoMode: true,
        embedded: !!embedded,
        trackingSid: window.__tgpSid || '',
        cancelUrl: window.location.href.split('#')[0]
      })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || 'Erreur');
        return j;
      });
    });
  }

  function showError(msg) {
    var box = document.getElementById('tgp-checkout');
    if (box) {
      box.innerHTML = '<p style="color:#b84040;text-align:center;padding:16px;font-family:sans-serif;">' + msg + '</p>';
    } else {
      alert(msg);
    }
  }

  // ── 97€ : formulaire de carte intégré dans la page ────────────────
  var started = false;

  function payOneshot(auto) {
    var box = document.getElementById('tgp-checkout');
    if (!box) { showError("Zone de paiement introuvable sur la page."); return; }
    if (started) { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    started = true;

    if (auto !== true) trackClick('Paiement intégré 97€', '/paiement-integre');
    box.innerHTML = '<p style="text-align:center;padding:16px;font-family:sans-serif;">Chargement du paiement sécurisé…</p>';

    Promise.all([createSession('oneshot', true), loadStripeJs()])
      .then(function (res) {
        var data = res[0];
        if (!data.clientSecret || !data.publishableKey) {
          throw new Error('Paiement indisponible pour le moment.');
        }
        if (checkoutInstance) { try { checkoutInstance.destroy(); } catch (e) {} }
        box.innerHTML = '';
        var stripe = window.Stripe(data.publishableKey);
        return stripe.initEmbeddedCheckout({ clientSecret: data.clientSecret });
      })
      .then(function (checkout) {
        checkoutInstance = checkout;
        checkout.mount('#tgp-checkout');
        if (auto !== true) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      })
      .catch(function (err) {
        started = false;
        showError(err.message || 'Une erreur est survenue. Réessaie.');
      });
  }

  // ── Affichage automatique du formulaire quand la zone devient visible ──
  function autoStart() {
    var box = document.getElementById('tgp-checkout');
    if (!box) return;
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { io.disconnect(); payOneshot(true); }
      }, { rootMargin: '400px' });
      io.observe(box);
    } else {
      payOneshot(true);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', autoStart);
  } else {
    autoStart();
  }

  // ── 9,99€/mois : redirection vers la page Stripe ──────────────────
  function payMonthly() {
    trackClick('Paiement mensuel 9,99€', '/stripe-mensuel');
    createSession('monthly', false)
      .then(function (data) {
        if (!data.url) throw new Error('Paiement indisponible pour le moment.');
        window.location.href = data.url;
      })
      .catch(function (err) {
        showError(err.message || 'Une erreur est survenue. Réessaie.');
      });
  }

  // ── Écoute des clics sur les boutons systeme.io ───────────────────
  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document) {
      var href = el.getAttribute && el.getAttribute('href');
      if (href && href.indexOf('#tgp-oneshot') !== -1) {
        e.preventDefault(); e.stopPropagation(); payOneshot(); return;
      }
      if (href && href.indexOf('#tgp-monthly') !== -1) {
        e.preventDefault(); e.stopPropagation(); payMonthly(); return;
      }
      el = el.parentElement;
    }
  }, true);
})();
</script>
